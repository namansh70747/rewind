site_name: Rewind
site_description: >-
  A flight recorder and time-travel debugger for AI agents — record-replay meets
  git bisect, Sentry/Datadog for AI-agent debugging.
site_author: Naman Sharma
repo_url: https://github.com/namansh70747/rewind
repo_name: namansh70747/rewind

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Actual local-model demo: local-model-demo.md
  - Completion checklist: completion-checklist.md
  - Home: index.md
  - Demo and viva: demo-guide.md
  - Implemented architecture: implementation.md
  - Validation: validation.md
  - Roadmap evidence: roadmap-status.md
  - Integration guide: integrations.md
  - Sample gallery: gallery.md
  - Release candidate: release-candidate.md
  - Release execution: release-guide.md
  - Design: design.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - 6-Month Plan:
      - Overview: plan/README.md
      - Team & Cadence: plan/team-and-cadence.md
      - Roadmap (week by week): plan/roadmap-6-months.md
      - Milestones & Exit Criteria: plan/milestones-and-exit-criteria.md
      - Risks & Spikes: plan/risks-and-spikes.md
      - Tech Stack & OSS Map: plan/tech-stack-and-oss-map.md
      - Algorithms & Math: plan/algorithms-and-math.md
      - Competitive Landscape: plan/competitive-landscape.md
  - Glossary: glossary.md
  - FAQ: faq.md
  - Decisions:
      - Overview: adr/README.md
      - "ADR-0000: Template": adr/0000-template.md
      - "ADR-0001: Flagship record-replay + time-travel": adr/0001-flagship-record-replay-time-travel-debugger.md
      - "ADR-0002: Vendor-neutral OTel core + fleet adapter": adr/0002-vendor-neutral-otel-core-plus-fleet-adapter.md
      - "ADR-0003: Embedded, local-first storage": adr/0003-embedded-local-first-storage.md
      - "ADR-0004: Python primary stack": adr/0004-python-primary-stack.md
      - "ADR-0005: ML classifier now, LoRA later": adr/0005-ml-classifier-now-lora-later.md
      - "ADR-0006: Replay is playback, not re-execution": adr/0006-replay-is-playback-not-re-execution.md
      - "ADR-0007: Capture at the HTTP transport layer": adr/0007-capture-at-http-transport-layer.md
      - "ADR-0008: Own the recording schema; OTel as export": adr/0008-internal-recording-schema-otel-as-export.md
      - "ADR-0009: Local alpha safe counterfactuals": adr/0009-local-alpha-safe-counterfactuals.md

  - "Storage and scope ADR": adr/0010-roadmap-storage-and-scope.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
