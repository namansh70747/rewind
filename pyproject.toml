[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewind"
dynamic = ["version"]
description = "An open-source flight recorder and time-travel debugger for AI agents: record every step, replay it deterministically, and rewind to any moment."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Naman Sharma", email = "nsharma_be24@thapar.edu" }]
keywords = [
    "ai-agents",
    "llm",
    "observability",
    "debugging",
    "record-replay",
    "opentelemetry",
    "time-travel-debugging",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]

# Phase-0 walking-skeleton runtime deps. Storage uses stdlib sqlite3 + zlib + hashlib
# (content-addressed blobs). Later phases add: wrapt (broad interception),
# opentelemetry-sdk (+ semantic-conventions), zstandard, duckdb, orjson, lancedb.
dependencies = [
    "httpx>=0.27",   # transport-layer capture (ADR-0007); OpenAI/Anthropic/NVIDIA ride httpx
    "typer>=0.12",   # the `fr` CLI
    "rich>=13",      # timeline rendering
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/namansh70747/rewind"
Repository = "https://github.com/namansh70747/rewind"
Issues = "https://github.com/namansh70747/rewind/issues"
Changelog = "https://github.com/namansh70747/rewind/blob/main/CHANGELOG.md"
Documentation = "https://github.com/namansh70747/rewind#readme"

[project.scripts]
fr = "flightrecorder.cli:app"

[tool.hatch.version]
path = "src/flightrecorder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flightrecorder"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["flightrecorder"]

[tool.ruff.format]
# Use ruff-format defaults (double quotes, spaces, trailing commas).

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["flightrecorder"]
branch = true

[tool.coverage.report]
show_missing = true
