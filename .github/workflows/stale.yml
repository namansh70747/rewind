name: Stale

on:
  schedule:
    # Daily at 01:30 UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Run stale action
        uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            had no activity for 60 days. It will be closed in 14 days if no
            further activity occurs. If it is still relevant, just leave a
            comment and we will keep it open. Thank you for your contribution.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has had no activity for 60 days. It will be closed in 14 days if no
            further activity occurs. If you are still working on it, leave a
            comment and we will keep it open. Thank you for your contribution.
          close-issue-message: >
            This issue was closed because it has been stale for 14 days with no
            activity. Feel free to reopen it if it is still relevant.
          close-pr-message: >
            This pull request was closed because it has been stale for 14 days
            with no activity. Feel free to reopen it when you are ready to
            continue.
          exempt-all-milestones: true
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security,roadmap"
