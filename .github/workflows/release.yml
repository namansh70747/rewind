name: Release candidate and publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev --extra docs --extra integrations --extra tui --extra ml
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest
      - run: uv run mkdocs build --strict
      - run: uv run fr demo --n 50
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-dist
          path: dist/*
      # Manual candidate builds stop here; only reviewed tags may publish.
      - name: Require recorded release evidence
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run fr release-check docs/release-evidence/checklist.json
      - name: Require release commit on main and matching package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          uv run python -c 'import os; from flightrecorder import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-dist
          path: dist/
      # Maintainer must configure the PyPI trusted publisher and protect this environment.
      - uses: pypa/gh-action-pypi-publish@release/v1
